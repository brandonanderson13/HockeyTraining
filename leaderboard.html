<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard - Delano Tigers Training</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Barlow', sans-serif; background: #0D0D0D; color: #fff; padding: 20px; min-height: 100vh; }
  .container { max-width: 900px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 32px; padding: 24px; background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%); border: 1px solid #222; border-radius: 12px; }
  .header h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
  .header h1 span { color: #E07820; }
  .header p { font-size: 14px; color: rgba(255,255,255,0.5); }
  .reset-info { text-align: center; font-size: 12px; color: rgba(255,255,255,0.4); margin-bottom: 24px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; justify-content: center; }
  .tab-btn { background: #1a1a1a; border: 1px solid #333; color: rgba(255,255,255,0.6); font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 10px 20px; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
  .tab-btn.active { background: #E07820; border-color: #E07820; color: #fff; }
  .tab-btn:hover:not(.active) { border-color: #E07820; }
  .leaderboard { background: #141414; border: 1px solid #222; border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead { background: #1a1a1a; }
  th { text-align: left; padding: 14px 16px; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(255,255,255,0.5); border-bottom: 1px solid #222; }
  th.num { text-align: center; width: 60px; }
  th.stat { text-align: right; }
  td { padding: 14px 16px; border-bottom: 1px solid #1a1a1a; font-size: 14px; }
  td.rank { text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; width: 60px; }
  td.name { font-weight: 600; color: rgba(255,255,255,0.9); }
  td.stat { text-align: right; font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; }
  tr.top1 { background: rgba(255, 215, 0, 0.08); }
  tr.top1 td.rank { color: #ffd700; }
  tr.top2 { background: rgba(192, 192, 192, 0.06); }
  tr.top2 td.rank { color: #c0c0c0; }
  tr.top3 { background: rgba(205, 127, 50, 0.06); }
  tr.top3 td.rank { color: #cd7f32; }
  .empty { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.4); font-size: 14px; }
  .loading { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.5); font-size: 14px; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1><span id="orgName">Delano</span> <span id="teamName">Tigers</span> Leaderboard</h1>
    <p>Top performers — updated live</p>
  </div>
  
  <div class="reset-info" id="resetInfo">Loading period...</div>
  
  <div class="tabs">
    <button class="tab-btn active" onclick="switchBoard('shots')" id="tabShots">Most Shots</button>
    <button class="tab-btn" onclick="switchBoard('stickhandling')" id="tabStick">Most Stickhandling</button>
    <button class="tab-btn" onclick="switchBoard('workouts')" id="tabWorkouts">Most Workouts</button>
  </div>
  
  <div class="leaderboard">
    <div id="leaderboardContent" class="loading">Loading...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://sfkdwprzwtegfkohqsdy.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNma2R3cHJ6d3RlZ2Zrb2hxc2R5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MjczNjgsImV4cCI6MjA5NTUwMzM2OH0.Sy1O-2OgIjy1qDJgK3Gw0obA59LKVKxryVjuCEjiDzY';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Get parameters from URL
const urlParams = new URLSearchParams(window.location.search);
const orgId = urlParams.get('org') || 'delano';
const startDate = urlParams.get('start'); // Optional: YYYY-MM-DD format
const endDate = urlParams.get('end'); // Optional: YYYY-MM-DD format

let currentBoard = 'shots';

async function loadLeaderboard() {
  const content = document.getElementById('leaderboardContent');
  
  // Update period display
  const resetInfo = document.getElementById('resetInfo');
  if (startDate && endDate) {
    const start = new Date(startDate);
    const end = new Date(endDate);
    resetInfo.textContent = `Period: ${start.toLocaleDateString('en-US', {month: 'short', day: 'numeric'})} - ${end.toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric'})}`;
  } else if (startDate) {
    resetInfo.textContent = `Period: From ${new Date(startDate).toLocaleDateString('en-US')}`;
  } else if (endDate) {
    resetInfo.textContent = `Period: Until ${new Date(endDate).toLocaleDateString('en-US')}`;
  } else {
    resetInfo.textContent = 'All-time stats';
  }
  
  // Update header based on org
  if (orgId === 'delano') {
    document.getElementById('orgName').textContent = 'Delano';
    document.getElementById('teamName').textContent = 'Tigers';
  } else if (orgId === 'individual') {
    document.getElementById('orgName').textContent = 'Individual';
    document.getElementById('teamName').textContent = 'Players';
  }
  
  try {
    let players = [];
    
    if (currentBoard === 'shots') {
      let query = sb.from('shooting_sessions').select('user_id, total_shots').eq('organization_id', orgId);
      if (startDate) query = query.gte('session_date', startDate);
      if (endDate) query = query.lte('session_date', endDate);
      const { data: sessions } = await query;
      const { data: subs } = await sb.from('subscriptions').select('user_id, first_name, last_name').eq('status', 'active').eq('organization_id', orgId);
      
      const shotsByUser = {};
      if (sessions) {
        sessions.forEach(s => {
          shotsByUser[s.user_id] = (shotsByUser[s.user_id] || 0) + (s.total_shots || 0);
        });
      }
      
      if (subs) {
        players = subs
          .filter(s => shotsByUser[s.user_id] > 0)
          .map(s => ({
            name: `${s.first_name || 'Player'} ${s.last_name || ''}`.trim(),
            value: shotsByUser[s.user_id]
          }))
          .sort((a, b) => b.value - a.value);
      }
    } else if (currentBoard === 'stickhandling') {
      let query = sb.from('stickhandling_sessions').select('user_id, minutes').eq('organization_id', orgId);
      if (startDate) query = query.gte('session_date', startDate);
      if (endDate) query = query.lte('session_date', endDate);
      const { data: sessions } = await query;
      const { data: subs } = await sb.from('subscriptions').select('user_id, first_name, last_name').eq('status', 'active').eq('organization_id', orgId);
      
      const minsByUser = {};
      if (sessions) {
        sessions.forEach(s => {
          minsByUser[s.user_id] = (minsByUser[s.user_id] || 0) + (s.minutes || 0);
        });
      }
      
      if (subs) {
        players = subs
          .filter(s => minsByUser[s.user_id] > 0)
          .map(s => ({
            name: `${s.first_name || 'Player'} ${s.last_name || ''}`.trim(),
            value: minsByUser[s.user_id]
          }))
          .sort((a, b) => b.value - a.value);
      }
    } else if (currentBoard === 'workouts') {
      let query = sb.from('exercise_completions').select('user_id').eq('organization_id', orgId);
      if (startDate) query = query.gte('completion_date', startDate);
      if (endDate) query = query.lte('completion_date', endDate);
      const { data: completions } = await query;
      
      const { data: subs } = await sb.from('subscriptions').select('user_id, first_name, last_name').eq('status', 'active').eq('organization_id', orgId);
      
      const workoutsByUser = {};
      if (completions) {
        completions.forEach(c => {
          workoutsByUser[c.user_id] = (workoutsByUser[c.user_id] || 0) + 1;
        });
      }
      
      if (subs) {
        players = subs
          .filter(s => workoutsByUser[s.user_id] > 0)
          .map(s => ({
            name: `${s.first_name || 'Player'} ${s.last_name || ''}`.trim(),
            value: workoutsByUser[s.user_id]
          }))
          .sort((a, b) => b.value - a.value);
      }
    }
    
    if (!players || players.length === 0) {
      content.innerHTML = '<div class="empty">No data yet — start logging sessions to see the leaderboard!</div>';
      return;
    }
    
    let html = '<table><thead><tr><th class="num">#</th><th>Player</th><th class="stat">' + (currentBoard === 'shots' ? 'Shots' : (currentBoard === 'stickhandling' ? 'Minutes' : 'Workouts')) + '</th></tr></thead><tbody>';
    
    players.forEach((p, i) => {
      const rank = i + 1;
      const rowClass = rank === 1 ? 'top1' : (rank === 2 ? 'top2' : (rank === 3 ? 'top3' : ''));
      html += `<tr class="${rowClass}">
        <td class="rank">${rank}</td>
        <td class="name">${p.name}</td>
        <td class="stat">${p.value.toLocaleString()}</td>
      </tr>`;
    });
    
    html += '</tbody></table>';
    content.innerHTML = html;
    
  } catch (error) {
    console.error('Leaderboard error:', error);
    content.innerHTML = '<div class="empty">Error loading: ' + error.message + '</div>';
  }
}

function switchBoard(type) {
  currentBoard = type;
  document.getElementById('tabShots').classList.toggle('active', type === 'shots');
  document.getElementById('tabStick').classList.toggle('active', type === 'stickhandling');
  document.getElementById('tabWorkouts').classList.toggle('active', type === 'workouts');
  loadLeaderboard();
}

loadLeaderboard();
setInterval(loadLeaderboard, 30000);
</script>
</body>
</html>
