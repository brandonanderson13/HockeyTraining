<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - Delano Tigers Training</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Barlow', sans-serif; background: #0D0D0D; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .container { max-width: 440px; width: 100%; }
  .logo { text-align: center; margin-bottom: 32px; }
  .logo h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
  .logo h1 span { color: var(--primary-color); }
  .logo p { font-size: 13px; color: rgba(255,255,255,0.5); }
  .card { background: #141414; border: 1px solid #2a2a2a; border-radius: 12px; padding: 32px 28px; box-shadow: 0 4px 12px rgba(var(--primary-rgb), 0.08); }
  .card h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; color: var(--primary-color); }
  .card p { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.6; margin-bottom: 16px; }
  label { display: block; font-size: 11px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(255,255,255,0.5); margin-bottom: 6px; }
  input[type="email"], input[type="password"] { width: 100%; background: #0d0d0d; border: 1px solid #333; color: #fff; font-size: 15px; padding: 12px 14px; border-radius: 8px; font-family: 'Barlow', sans-serif; margin-bottom: 18px; }
  input { border: 1px solid #333; }
  input:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 1px rgba(var(--primary-rgb), 0.3); }
  button { width: 100%; background: var(--primary-color); color: #fff; border: none; font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 13px 20px; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
  button:hover { background: #c96819; }
  button:disabled { background: #444; color: #888; cursor: not-allowed; }
  .message { margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 13px; text-align: center; display: none; }
  .message.success { background: rgba(74, 222, 128, 0.15); border: 1px solid rgba(74, 222, 128, 0.3); color: #4ade80; }
  .message.error { background: rgba(248, 113, 113, 0.15); border: 1px solid rgba(248, 113, 113, 0.3); color: #f87171; }
  .link { color: var(--primary-color); text-decoration: none; font-size: 12px; }
  .link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <h1><span>Delano</span> Tigers Training</h1>
    <p>12-Week Off-Ice Development Program</p>
  </div>
  
  <div class="card">
    <h2>Sign In</h2>
    <p>Sign in with your email and password.</p>
    <p style="font-size:12px;margin-bottom:16px;color:rgba(255,255,255,0.45);">Don't have an account? <a href="subscribe.html" class="link" style="font-weight:600;">Subscribe here</a></p>
    
    <form id="loginForm">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="your.email@example.com" required autocomplete="email">
      
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
      
      <button type="submit" id="submitBtn">Sign In</button>
    </form>
    
    <div style="text-align:center;margin-top:14px;">
      <a href="#" onclick="handleForgotPassword();return false;" class="link">Forgot password?</a>
    </div>
    
    <div id="message" class="message"></div>
  </div>
  
  <div style="text-align:center;margin-top:24px;font-size:12px;color:rgba(255,255,255,0.35);">
    Delano Youth Hockey Association
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function() {
  const SUPABASE_URL = 'https://sfkdwprzwtegfkohqsdy.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNma2R3cHJ6d3RlZ2Zrb2hxc2R5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MjczNjgsImV4cCI6MjA5NTUwMzM2OH0.Sy1O-2OgIjy1qDJgK3Gw0obA59LKVKxryVjuCEjiDzY';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const submitBtn = document.getElementById('submitBtn');
    const message = document.getElementById('message');
    
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';
    message.style.display = 'none';
    
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      
      if (error) throw error;
      if (!data.user) throw new Error('Login failed');
      
      // Just redirect to index.html - let it handle subscription/role checks
      window.location.href = 'index.html';
      
    } catch (error) {
      message.className = 'message error';
      message.textContent = 'Error: ' + error.message;
      message.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    }
  });

  window.handleForgotPassword = async function() {
    const email = prompt('Enter your email for password reset:');
    if (!email) return;
    
    const message = document.getElementById('message');
    try {
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/login.html'
      });
      if (error) throw error;
      message.className = 'message success';
      message.textContent = '✓ Reset link sent! Check your email.';
      message.style.display = 'block';
    } catch (error) {
      message.className = 'message error';
      message.textContent = 'Error: ' + error.message;
      message.style.display = 'block';
    }
  };
})();
</script>
</body>
</html>
